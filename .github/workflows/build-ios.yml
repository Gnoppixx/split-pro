name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Capacitor
        run: |
          npm install @capacitor/cli @capacitor/ios @capacitor/core
          npx cap add ios
          npx cap sync ios

      - name: Build iOS
        run: |
          cd ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build
        env:
          CAPACITOR_IOS_URL: "http://127.0.0.1:3000"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: splitpro-ios.ipa
          path: ios/build/*.ipa
